version: "3.9"

services:
  api:
    build: .
    image: norm-ai-app
    env_file: .env
    ports:
      - "8000:80"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: 80
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped


